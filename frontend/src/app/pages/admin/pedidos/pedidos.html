<h1>Pedidos</h1>

<p *ngIf="erro()">
  {{ erro() }}
</p>

<p *ngIf="carregando()">Carregando...</p>

<p>
  <button (click)="carregar()">Todos</button>

  <button (click)="carregar('PENDENTE')">Pendentes</button>

  <button (click)="carregar('CONFIRMADO')">Confirmados</button>

  <button (click)="carregar('CONCLUIDO')">Concluídos</button>

  <button (click)="carregar('CANCELADO')">Cancelados</button>
</p>

<table border="1">
  <thead>
    <tr>
      <th>ID</th>
      <th>Cliente</th>
      <th>Telefone</th>
      <th>Status</th>
      <th>Total</th>
      <th>Ações</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let pedido of pedidos()">
      <td>#{{ pedido.id }}</td>

      <td>
        {{ pedido.cliente_nome }}
      </td>

      <td>
        {{ pedido.cliente_telefone }}
      </td>

      <td>
        {{ pedido.status }}
      </td>

      <td>R$ {{ pedido.total | number: '1.2-2' }}</td>

      <td>
        <button *ngIf="pedido.status === 'PENDENTE'" (click)="confirmar(pedido.id)">
          Confirmar
        </button>

        <button *ngIf="pedido.status === 'CONFIRMADO'" (click)="concluir(pedido.id)">
          Concluir
        </button>

        <button
          *ngIf="pedido.status === 'PENDENTE' || pedido.status === 'CONFIRMADO'"
          (click)="cancelar(pedido.id)"
        >
          Cancelar
        </button>
      </td>
    </tr>
  </tbody>
</table>
